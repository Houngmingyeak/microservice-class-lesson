spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: order-service
        prefer-ip-address: true
        ip-address: host.docker.internal
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
      config:
        format: YAML
        # true = អាន config ពី Consul KV (global.version, service.*, server.port)
        enabled: true
        watch:
          enabled: true

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: postgre

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: postgre
    driver-class-name: org.postgresql.Driver

# global.version, service.* និង server.port មកពី Consul KV ទាំងអស់ ដូច្នេះមិនដាក់ក្នុងនេះទេ

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always