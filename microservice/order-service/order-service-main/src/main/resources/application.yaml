server:
  port: 9093

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import: "optional:consul:localhost:8500"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: YAML
        watch:
          enabled: true
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: postgre

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: postgre
    driver-class-name: org.postgresql.Driver

