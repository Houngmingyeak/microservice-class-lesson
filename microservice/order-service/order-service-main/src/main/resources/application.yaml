server:
  port: 9099
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import: "optional:consul:localhost:8500"
  debug: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:39000
      client:
        registration:
          customer-service:
            provider: auth-server
            client-id: order-service
            client-secret: ${ORDER_CLIENT_SECRET:my-secret}
            authorization-grant-type: client_credentials
            scope:
              - customer.read
        provider:
          auth-server:
            token-uri: http://localhost:39000/oauth2/token

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: YAML
        watch:
          enabled: true
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: postgre

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: postgre
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: "health,gateway"
  endpoint:
    gateway:
      access: read_only
grpc:
  client:
    customer:
      address: localhost:9090