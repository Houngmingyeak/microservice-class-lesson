plugins {
    id 'springboot-common-conventions'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.2'
    }
}

dependencies {
    implementation 'kh.edu.istad:order-domain-core'
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:order-service-message'
    implementation 'kh.edu.istad:order-service-persistence'
    implementation 'kh.edu.istad:order-service-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}