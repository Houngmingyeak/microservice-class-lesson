plugins {
    id 'springboot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation 'kh.edu.istad:order-domain-core'
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:order-service-message'
    implementation 'kh.edu.istad:order-service-persistence'
    implementation 'kh.edu.istad:order-service-restapi'
    implementation 'kh.edu.istad:order-service-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly( 'org.postgresql:postgresql')
    runtimeOnly( 'org.postgresql:r2dbc-postgresql')
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    // dependency សម្រាប់ test (JUnit 5 + Spring Boot test)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Gradle 9 ត្រូវការ launcher នេះដោយបញ្ជាក់ច្បាស់ ទើបរត់ JUnit 5 បាន
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
//    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}
// ប្រាប់ Gradle ឱ្យប្រើ JUnit Platform (JUnit 5) ជំនួស JUnit 4
tasks.named('test') {
    useJUnitPlatform()
}