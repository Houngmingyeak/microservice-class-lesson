server:
  port: 39000
  servlet:
    session:
      cookie:
        name: IAM_SESSION

spring:
  application:
    name: iam-service

  security:
    oauth2:
      client:
        registration:
          github:
            provider: github
            client-id: ${GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret}
            client-name: GitHub
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          google:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            client-name: Google
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          # <-- ថ្មី: Facebook (OAuth2 ធម្មតា Spring មាន preset ឈ្មោះ facebook រួចហើយ)
          facebook:
            provider: facebook
            client-id: ${FACEBOOK_CLIENT_ID:facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-client-secret}
            client-name: Facebook
#            scope: public_profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          # <-- ថ្មី: Telegram (OpenID Connect)
          telegram:
            provider: telegram
            client-id: ${TELEGRAM_CLIENT_ID:telegram-client-id}
            client-secret: ${TELEGRAM_CLIENT_SECRET:telegram-client-secret}
            client-name: Telegram
            authorization-grant-type: authorization_code
            # Telegram ទាមទារ Basic Authorization (client_id:client_secret) ពេលប្តូរ code ជា token
            client-authentication-method: client_secret_basic
            # openid ចាំបាច់ profile ផ្តល់ឈ្មោះ username រូបភាព
#            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          github:
          google:
          facebook:                              # <-- ថ្មី (ទទេ ដូច github/google)
          telegram:                              # <-- ថ្មី: Telegram មិនមាន preset ត្រូវដាក់ URL ខ្លួនឯង
            authorization-uri: https://oauth.telegram.org/auth
            token-uri: https://oauth.telegram.org/token
            jwk-set-uri: https://oauth.telegram.org/.well-known/jwks.json
            # Telegram មិនមាន UserInfo endpoint ដូច្នេះមិនដាក់ user-info-uri
            # ហើយប្រើ sub ក្នុង id_token ជាអត្តសញ្ញាណអ្នកប្រើ
            user-name-attribute: sub
      authorizationserver:
        issuer: http://localhost:39000

  datasource:
    url: jdbc:postgresql://localhost:9543/db_oauth2
    username: iteuser
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  session:
    jdbc:
      initialize-schema: always

  liquibase:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

gg:
  jte:
    development-mode: true
    template-location: microservice/iam-service/iam-web/src/main/jte

logging:
  level:
    org.springframework.security: TRACE

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
  bot-username: ${TELEGRAM_BOT_USERNAME:mock_telegram_bot}