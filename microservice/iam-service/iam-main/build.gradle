plugins {
    id 'springboot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation project(':iam-persistence')
    implementation project(':iam-infrastructure')
    implementation project(':iam-rest-api')
    implementation project(':iam-web')

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}
tasks.named('test') {
    useJUnitPlatform()
}
