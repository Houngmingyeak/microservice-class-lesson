plugins {
    id 'java-library'
    id 'springboot-common-conventions'
}

tasks.named('bootJar') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}

dependencies {
    api project(':iam-domain:iam-application-service')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JTE template engine សម្រាប់ Spring Boot 4.x (ជំនួស Thymeleaf)
    // ត្រូវដាក់ជំនាន់ច្បាស់លាស់ ព្រោះ Spring Boot BOM មិនគ្រប់គ្រង JTE
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}