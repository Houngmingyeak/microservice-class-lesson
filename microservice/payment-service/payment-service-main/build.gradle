plugins {
    id 'springboot-common-conventions'
}
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.2'
    }
}
dependencies {
    implementation project(':payment-service-domain:payment-domain-core')
    implementation project(':payment-service-domain:payment-application-service')
    implementation project(':payment-service-message')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-restapi')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}