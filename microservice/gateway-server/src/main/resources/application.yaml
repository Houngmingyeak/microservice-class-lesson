server:
  port: 9999
  reactive:
    session:
      cookie:
        name: GATEWAY_SESSION

spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
            - TokenRelay
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: business-service
              uri: lb://business-service
              predicates:
                - Path=/business-service/**
              filters:
                - StripPrefix=1

            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /${segment}

            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /${segment}

            - id: nextjs
              uri: http://localhost:3000
              predicates:
                - Path=/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:39000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:39000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health, gateway
  endpoint:
    gateway:
      access: read_only

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.web.reactive.function.client: DEBUG
