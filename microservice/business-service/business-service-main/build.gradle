plugins {
    id 'springboot-common-conventions'
}
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.2'
    }
}
dependencies {
    implementation 'kh.edu.istad:business-domain-core'
    implementation 'kh.edu.istad:business-application-service'
    implementation 'kh.edu.istad:business-service-message'
    implementation 'kh.edu.istad:business-service-persistence'
    implementation 'kh.edu.istad:business-service-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}