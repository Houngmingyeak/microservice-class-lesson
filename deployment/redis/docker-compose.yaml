volumes:
  ite-redis-vol:
    driver: local

networks:
  ite-net:
    external: true

services:
  ite-redis:
    container_name: ite-redis
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ite-redis-vol:/data
    networks:
      - ite-net
    command: redis-server --appendonly yes
